<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080812">
<title>Login / Register — SOURAJIT VFX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080812;--panel:#121327;--line:#ffffff1c;--text:#f7f7ff;--muted:#a4a8c3;--cyan:#69f4ff;--violet:#a18aff;--pink:#ff72cb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 15% 10%,#69f4ff20,transparent 35%),radial-gradient(ellipse at 85% 20%,#a18aff25,transparent 35%),#080812;color:var(--text);font-family:Manrope,system-ui,sans-serif}.shell{width:min(100%,460px)}a{color:var(--cyan);text-decoration:none}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;font-weight:800}.logo{display:grid;place-items:center;width:45px;height:45px;border-radius:14px;color:#071018;background:linear-gradient(135deg,var(--cyan),var(--violet),var(--pink))}.brand small{display:block;color:var(--muted);font:10px 'DM Mono';letter-spacing:.16em;margin-top:3px}.panel{border:1px solid var(--line);background:#121327d9;backdrop-filter:blur(20px);border-radius:23px;padding:27px;box-shadow:0 25px 80px #0006}.kicker{font:11px 'DM Mono';letter-spacing:.15em;color:var(--cyan)}h1{font-size:30px;letter-spacing:-.05em;margin:12px 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.7}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:24px 0 20px}.tab,button{cursor:pointer;border-radius:11px;padding:12px;border:1px solid var(--line);background:#ffffff08;color:var(--text);font:700 12px Manrope}.tab.active,button.primary{color:#061017;background:linear-gradient(110deg,var(--cyan),#b9b0ff);border:0}label{display:block;font-size:12px;color:#dce0fa;margin:14px 0 7px}input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#080812;color:white;outline:none;font:13px Manrope}input:focus{border-color:var(--cyan)}.submit{width:100%;margin-top:18px;padding:14px}.message{min-height:22px;font-size:12px;color:var(--pink);margin-top:12px}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}.hidden{display:none!important}.back{display:inline-block;margin-top:20px;font-size:12px}@media(max-width:420px){.panel{padding:21px}h1{font-size:26px}}
</style></head>
<body><main class="shell"><a class="brand" href="index.html"><span class="logo">SV</span><span>𝐒ꭷᴜʀᴀᴊɪᴛ メ 𝐕𝐅𝐗<small>MINI AUTOMATION LAB</small></span></a>
<section class="panel"><div class="kicker">YOUR ACCOUNT · SECURE ACCESS</div><h1 id="heading">Welcome back.</h1><p class="muted" id="subheading">Sign in to open your personal dashboard and save your settings.</p>
<div class="tabs"><button class="tab active" id="loginTab" type="button">LOGIN</button><button class="tab" id="registerTab" type="button">REGISTER</button></div>
<form id="authForm"><div id="nameWrap" class="hidden"><label for="displayName">Display name</label><input id="displayName" autocomplete="name" maxlength="60" placeholder="Your name"></div><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters"><button class="primary submit" id="submitBtn" type="submit">LOGIN TO DASHBOARD ↗</button><div class="message" id="message" role="status" aria-live="polite"></div></form>
<p class="muted">Your account is handled by Firebase Authentication. Never share your password with anyone.</p></section><div class="foot">© <span id="year"></span> SOURAJIT VFX · <a href="index.html">Back to home</a></div></main>
<script type="module">
import {auth,db} from './firebase.js';
import {createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {doc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const $=id=>document.getElementById(id);let mode='login';
function setMode(next){mode=next;const reg=mode==='register';$('loginTab').classList.toggle('active',!reg);$('registerTab').classList.toggle('active',reg);$('nameWrap').classList.toggle('hidden',!reg);$('displayName').required=reg;$('heading').textContent=reg?'Create your account.':'Welcome back.';$('subheading').textContent=reg?'Register to unlock your personal dashboard and save your settings.':'Sign in to open your personal dashboard and save your settings.';$('submitBtn').textContent=reg?'CREATE ACCOUNT ↗':'LOGIN TO DASHBOARD ↗';$('message').textContent=''}
$('loginTab').addEventListener('click',()=>setMode('login'));$('registerTab').addEventListener('click',()=>setMode('register'));$('year').textContent=new Date().getFullYear();
$('authForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('submitBtn');btn.disabled=true;$('message').style.color='var(--muted)';$('message').textContent=mode==='register'?'Creating account…':'Signing in…';try{let credential;if(mode==='register'){const name=$('displayName').value.trim();credential=await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);if(name)await updateProfile(credential.user,{displayName:name});await setDoc(doc(db,'users',credential.user.uid),{displayName:name,email:credential.user.email,createdAt:serverTimestamp(),settings:{botName:'𝐒ꭷᴜʀᴀᴊɪᴛ メ 𝐕𝐅𝐗',botPictureUrl:'',socialLink:'https://github.com/Rdx690/SOURAJIT-VFX-Mini'}},{merge:true})}else{credential=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}location.href='dashboard.html'}catch(err){const errors={'auth/email-already-in-use':'This email already has an account. Try logging in.','auth/invalid-credential':'Email or password is incorrect.','auth/weak-password':'Choose a password with at least 6 characters.','auth/invalid-email':'Enter a valid email address.','auth/too-many-requests':'Too many attempts. Wait a bit and try again.','auth/operation-not-allowed':'Enable Email/Password in Firebase Console → Authentication → Sign-in method.'};$('message').style.color='var(--pink)';$('message').textContent=errors[err.code]||err.message||'Something went wrong.'}finally{btn.disabled=false}});
if(auth.currentUser)location.replace('dashboard.html');
</script></body></html>
